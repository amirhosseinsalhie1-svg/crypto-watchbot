services:
  watchbot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot-state:/app/runtime
      - ./config.json:/app/config.json:ro
      - ./news.json:/app/news.json:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  bot-state:
