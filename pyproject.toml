[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-watchbot"
version = "0.2.0"
description = "Closed-candle multi-timeframe research alerts and paper trading"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3; python_version < '3.15'", "pandas>=3.0.6,<4; python_version >= '3.15'", "matplotlib>=3.8,<4", "websockets>=14,<16", "tzdata>=2024.1; sys_platform == 'win32'"]

[project.scripts]
watchbot = "watchbot.cli:main"

[tool.setuptools.packages.find]
include = ["watchbot*"]
